<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Registration | WAEC Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../page/styles.css" />
  </head>
  <body data-page="admin-register" class="auth-body">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark"><div class="brand-ring"></div><div class="brand-core"><span>W</span></div></div>
        <div>
          <h1>WAEC</h1>
          <p>Admin Registration</p>
        </div>
      </div>

      <h2>Create Admin Account</h2>
      <form id="adminRegisterForm" class="auth-form">
        <label>
          Full Name
          <input type="text" name="fullName" placeholder="Enter administrator name" required />
        </label>

        <label>
          Admin ID
          <input type="text" name="adminId" placeholder="Enter admin ID" required />
        </label>

        <label>
          Email Address
          <input type="email" name="email" placeholder="Enter email" required />
        </label>

        <label>
          Password
          <input type="password" name="password" placeholder="Create password" required />
        </label>

        <label>
          Confirm Password
          <input type="password" name="confirmPassword" placeholder="Confirm password" required />
        </label>

        <p id="registerMessage" class="auth-message" aria-live="polite"></p>

        <button type="submit" class="primary-button auth-button">Register</button>
      </form>

      <p class="muted-link" style="margin-top: 18px; text-align: center; color: var(--gray-500);">
        Already have an account?
        <a href="login.html" style="color: var(--blue-600); font-weight: 700; text-decoration: none;">Sign in</a>
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
