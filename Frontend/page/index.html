                <h3>Certificate Status</h3>
              </div>

              <div class="timeline" aria-label="Certificate application status">
                <div class="timeline-item completed">
                  <div class="bubble">✓</div>
                  <div class="stage-copy">
                    <h4>Application Received</h4>
                    <span>12 Mar 2024</span>
                  </div>
                  <div class="status-tag">Completed</div>
                </div>

                <div class="timeline-item completed">
                  <div class="bubble">✓</div>
                  <div class="stage-copy">
                    <h4>Verification Completed</h4>
                    <span>14 Mar 2024</span>
                  </div>
                  <div class="status-tag">Completed</div>
                </div>

                <div class="timeline-item completed">
                  <div class="bubble">✓</div>
                  <div class="stage-copy">
                    <h4>Certificate Issued</h4>
                    <span>16 Mar 2024</span>
                  </div>
                  <div class="status-tag">Completed</div>
                </div>

                <div class="timeline-item pending">
                  <div class="bubble pending-bubble">○</div>
                  <div class="stage-copy">
                    <h4>Delivered</h4>
                    <span>—</span>
                  </div>
                  <div class="status-tag pending-tag">Pending</div>
                </div>
              </div>
            </article>

            <aside class="quick-actions-card">
              <div class="card-heading">
                <h3>Quick Actions</h3>
              </div>

              <div class="action-list">
                <button class="action-item" type="button">
                  <div class="action-icon verify">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12.5l2.5 2.5L16 7.5M5 12A7 7 0 0 1 12 5a7 7 0 0 1 7 7 7 7 0 0 1-14 0Z"/></svg>
                  </div>
                  <div class="action-copy">
                    <strong>Verify Certificate</strong>
                    <span>Check authenticity of a certificate</span>
                  </div>
                  <svg class="action-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>

                <button class="action-item" type="button">
                  <div class="action-icon request">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h8l4 4V18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Zm8 1.5v4h4M8 12h8M8 16h5"/></svg>
                  </div>
                  <div class="action-copy">
                    <strong>Request Another Certificate</strong>
                    <span>For lost or damaged certificates</span>
                  </div>
                  <svg class="action-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>

                <button class="action-item" type="button">
                  <div class="action-icon history">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8l4 4V18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Zm8 1.5v4h4M8 11h8M8 15h6"/></svg>
                  </div>
                  <div class="action-copy">
                    <strong>View Past Certificates</strong>
                    <span>Access previously issued certificates</span>
                  </div>
                  <svg class="action-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
