<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAEC Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body" data-page="login">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark"><div class="brand-ring"></div><div class="brand-core"><span>W</span></div></div>
        <div>
          <h1>WAEC</h1>
          <p>West African Examinations Council</p>
        </div>
      </div>

      <h2>Access your dashboard</h2>
      <form class="auth-form" action="" method="" id="loginForm" novalidate>
        <label>
          <span>Candidate Number</span>
          <input type="text" id="candidateNumber" placeholder="Enter candidate number" autocomplete="username" required />
        </label>
        <label>
          <span>Verification PIN</span>
          <input type="password" id="password" placeholder="Enter the verification PIN" autocomplete="current-password" required />
        </label>
        <p class="auth-message" id="authMessage" aria-live="polite"></p>
        <button class="primary-button auth-button" type="submit" data-link="dashboard.html">Access Dashboard</button>
      </form>

      <div class="auth-footer" style="margin-top: 20px; text-align: center;">
        <p>Need a PIN? <a href="register.html" style="color: #1d4ed8; font-weight: 600; text-decoration: none;">Generate a verification PIN</a></p>
        <p style="margin-top: 10px;">
          <button type="button" class="secondary-button" onclick="localStorage.removeItem('waecAdminAuth'); window.location.href='../admin/login.html';" style="display: inline-flex; justify-content: center; width: 100%; max-width: 280px; margin: 0 auto; color: #0c2344; text-decoration: none; border-radius: 12px; border: 1px solid #c7d1dc; background: #ffffff; padding: 12px 18px; font-weight: 700; cursor: pointer;">
            Go to Admin Login
          </button>
        </p>
      </div>
    </div>
     <script>
        window.__WAEC_API_BASE__ = 'https://waec-project.onrender.com';
    </script>
    <script src="script.js"></script>
  </body>
</html>
