<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="profile">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark"><div class="brand-ring"></div><div class="brand-core"><span>W</span></div></div>
          <div class="brand-copy"><h1>WAEC</h1><p>West African Examinations Council</p></div>
        </div>
        <nav class="side-nav">
          <button class="nav-item" type="button" data-page="dashboard" data-link="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-8.5Z"/></svg><span>Dashboard</span></button>
          <button class="nav-item" type="button" data-page="results" data-link="results.html"><svg viewBox="0 0 24 24"><path d="M5 18V8.5A2.5 2.5 0 0 1 7.5 6H16a2 2 0 0 1 2 2v10M5 18h14M9 10h6M9 14h6"/></svg><span>My Results</span></button>
          <button class="nav-item" type="button" data-page="verify" data-link="verify-certificate.html"><svg viewBox="0 0 24 24"><path d="M7 12.5V7.8A2.8 2.8 0 0 1 9.8 5h4.4A2.8 2.8 0 0 1 17 7.8v4.7a2.8 2.8 0 0 1-2.8 2.8H12l-3 3v-3.2A2.8 2.8 0 0 1 7 12.5Zm2.5-3.5h5M9.5 10h5"/></svg><span>Verify Certificate</span></button>
          <button class="nav-item active" type="button" data-page="profile" data-link="profile.html"><svg viewBox="0 0 24 24"><path d="M12 12.2a3.4 3.4 0 1 0-3.4-3.4 3.4 3.4 0 0 0 3.4 3.4Zm-6.4 7.3a6.4 6.4 0 0 1 12.8 0"/></svg><span>Profile</span></button>
          <button class="nav-item" type="button" data-page="support" data-link="support.html"><svg viewBox="0 0 24 24"><path d="M12 4.8a7.2 7.2 0 0 1 7.2 7.2v3.5l1.7 3.1H3.1l1.7-3.1V12A7.2 7.2 0 0 1 12 4.8Zm0 15.4a2.1 2.1 0 0 1-2.1-2.1h4.2A2.1 2.1 0 0 1 12 20.2Z"/></svg><span>Help &amp; Support</span></button>
          <button class="nav-item logout-item" type="button" data-page="login" data-link="login.html"><svg viewBox="0 0 24 24"><path d="M11 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7M4 12h12M13 7l5 5-5 5"/></svg><span>Logout</span></button>
        </nav>
        <div class="sidebar-tagline">Promoting Quality Education Across West Africa</div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <label class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l5 5"></path></svg><input type="text" placeholder="Search for results, certificates, or reference number..." /></label>
          <div class="top-actions">
            <button class="notify-button" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5m6 0a3 3 0 0 1-6 0"/></svg><span class="notify-dot"></span></button>
            <div class="user-meta"><div class="avatar" id="userAvatar">BE</div><div class="user-detail"><strong id="userFullName">Badejo Emmanuel</strong></div><svg class="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></div>
          </div>
        </header>

        <section class="content">
          <div class="page-heading"><h2>Profile</h2><p>Keep your personal and account details current and secure.</p></div>

          <div class="list-card form-card">
            <h3>Account Details</h3>
            <div class="profile-card">
              <div class="avatar large-avatar" id="profileAvatar">BE</div>
              <div>
                <strong id="profileFullName">Badejo Emmanuel</strong>
                <p id="profileCandidateId">Candidate ID: WAEC-2023-45678</p>
              </div>
            </div>
            <form class="form-grid">
              <label><span>Email</span><input id="profileEmail" type="email" value="emmanuel.badejo@waec.org" /></label>
              <label><span>Phone</span><input id="profilePhone" type="text" value="+234 812 345 6789" /></label>
              <label><span>Country</span><input id="profileCountry" type="text" value="Nigeria" /></label>
              <label><span>Account Type</span><input id="profileAccountType" type="text" value="Candidate" /></label>
            </form>
          </div>
        </section>
      </main>
    </div>
    <script>
      window.__WAEC_API_BASE__ = 'https://waec-project.onrender.com';
    </script>
    <script src="script.js"></script>
  </body>
</html>
